<meta name="apple-mobile-web-app-title" content="دفتر المعلم">
<title>دفتر المعلم</title>
<style>
:root{--bg:#f4f1f8;--card:#fff;--tx:#221a2e;--mu:#6b6179;--pr:#6b2fa0;--prt:#fff;--bd:#ddd6e8;--p:#1f9d55;--a:#d64545;--l:#d98a00;--e:#6d55c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f1d;--card:#211a2d;--tx:#eee8f6;--mu:#a99fba;--pr:#c19bf0;--prt:#1b1026;--bd:#382d4a;--p:#4cc17d;--a:#ee6b6b;--l:#f0ae3a;--e:#9c87f0}}
:root[data-theme="dark"]{--bg:#150f1d;--card:#211a2d;--tx:#eee8f6;--mu:#a99fba;--pr:#c19bf0;--prt:#1b1026;--bd:#382d4a;--p:#4cc17d;--a:#ee6b6b;--l:#f0ae3a;--e:#9c87f0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Geeza Pro","Noto Naskh Arabic",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:640px;margin:0 auto;padding:0 12px 110px}
header{display:flex;gap:8px;margin-bottom:10px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
select{flex:1}
textarea{resize:vertical;margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;white-space:nowrap}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--pr);color:var(--prt)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:14px;margin:2px 0}
.ok{color:var(--p);font-weight:600;margin:4px 0 0}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st b{font-weight:600}
.x{border:0;background:none;color:var(--mu);padding:4px 8px}
.x.arm{color:var(--a);font-weight:700}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.g4 button{padding:8px 0;font-size:14px}
.g4 button.on{color:#fff;border-color:transparent;font-weight:700}
.on.p{background:var(--p)}.on.a{background:var(--a)}.on.l{background:var(--l)}.on.e{background:var(--e)}
.sum{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.sum span{flex:1;min-width:70px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 4px;font-size:14px}
.sum i{display:block;font-style:normal;font-size:20px;font-weight:700}
.sc{width:84px;text-align:center}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:18px}
.tabs button{font-size:14px;padding:9px 2px}
.stars button{border:0;background:none;font-size:30px;padding:0 4px;color:var(--bd);line-height:1}
.stars button.on{color:var(--l)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:right}
.wide{overflow-x:auto}
a.tel{color:var(--pr);text-decoration:none;font-size:14px}
.stars.sm button{font-size:26px;padding:0 3px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{flex:0 0 auto;border-radius:999px;padding:7px 14px;font-size:14px}
.chips button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.card.now{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}

.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;margin:0 -12px 12px}
.top b{font-size:18px}.top .lg{display:flex;align-items:center;gap:8px;color:var(--pr);font-weight:700;font-size:15px}
.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.dchips button{flex:0 0 auto;border:2px solid var(--dc);border-radius:12px;padding:10px 16px;background:color-mix(in srgb,var(--dc) 14%,var(--card));font-weight:600}
.dchips button.on{background:var(--dc);color:#fff}
.hint{display:block;margin:0 auto 12px;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;color:var(--mu);font-size:14px;background:var(--card)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:104px;border:0;border-radius:14px;font-size:18px;font-weight:700;background:var(--dc);color:#fff;white-space:normal}
.pcard{display:block;width:100%;text-align:right;margin-bottom:10px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.pcard.now{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.prof{display:flex;align-items:center;gap:14px;background:var(--pr);color:var(--prt);margin:0 -12px 12px;padding:18px 16px}
.prof .av{width:64px;height:64px;border-radius:50%;background:var(--card);color:var(--mu);display:grid;place-items:center;font-size:30px;flex:0 0 auto}
.prof b{font-size:18px;display:block}.prof span{opacity:.9;direction:ltr;display:inline-block}
.prof button{margin-inline-start:auto;background:transparent;color:inherit;border-color:currentColor;padding:6px 12px}
.lrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px 14px;font-weight:600;text-align:right}
.lrow::after{content:"‹";color:var(--mu);font-size:22px;font-weight:400}
.lgrp{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:12px}
.lgrp .lrow:last-child{border-bottom:0}
.sec{color:var(--mu);font-weight:600;font-size:14px;margin:14px 4px 6px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;padding:4px 0}
.bnav button i{font-style:normal;font-size:22px;line-height:1.2}
.bnav button.on{color:var(--pr)}
button.bk{margin-bottom:10px}
.top .lg img{border-radius:7px}
.evl1{padding:6px 0;border-top:1px solid var(--bd)}.evl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px;border-top:1px solid var(--bd)}.evc{display:flex;flex-direction:column;gap:2px;min-width:0}.evlb{font-weight:600;font-size:14px}.evc .stars.sm button{font-size:22px;padding:0 2px}

.gt{border-collapse:separate;border-spacing:0;margin-top:0;font-size:13px}
.gt th,.gt td{border-inline-start:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px 6px;text-align:center;white-space:nowrap;background:var(--card)}
.gt th{background:var(--bg);font-weight:600}
.gt .gsn{position:sticky;right:0;z-index:2;text-align:right;min-width:112px;border-inline-start:0;box-shadow:-2px 0 0 var(--bd) inset}
.gt td.gsn{background:var(--card)}.gt th.gsn{background:var(--bg)}
.gt input{width:54px;text-align:center;padding:7px 2px;border:0;background:transparent;font:inherit;color:var(--tx)}
.gt input.dflt{color:var(--mu)}
.gt .gtot{font-weight:700;color:var(--pr)}
.wide tr.red td{color:#c0152f;font-weight:700;background:#fde8ea}
.gt tr.red td{color:#c0152f;font-weight:700;background:#fde8ea}.gt tr.red td.gsn{background:#fde8ea}.gt tr.red .gtot{color:#c0152f}
.gwrap{border:1px solid var(--bd);border-radius:12px;overflow-x:auto;max-height:68vh;background:var(--card)}
.grow{display:grid;grid-template-columns:1fr 70px 70px auto;gap:6px;align-items:end;padding:10px 0;border-top:1px solid var(--bd)}
.grow label{font-size:12px;color:var(--mu);display:block}
.stars.neg button.on{color:var(--a)}
</style>
</head>
<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script>
const K='teacher-notebook-v1';
let db={classes:[],cur:null,tab:'stu',date:'',exam:null};
let srch='',showEx=false,locked=false,pmsg='';
let msg='',armed=null,showAdd=false,edit=null,evSid=null,evStars=0,evNote='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,9);
const cls=()=>db.classes.find(c=>c.id===db.cur);
const curExam=()=>{const c=cls();return c&&c.exams.find(e=>e.id===db.exam)};
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}}
function save(){try{db.mt=Date.now();localStorage.setItem(K,JSON.stringify(db))}catch(e){}pushSoon()}

function addClass(){const n=$('#cn').value.trim();if(!n)return;const c={id:uid(),name:n,schoolId:$('#cs')?$('#cs').value||null:null,students:[],att:{},exams:[]};db.classes.push(c);db.cur=c.id;db.exam=null;save();render()}
function delClass(id){if(armed!==id){armed=id;render();return}db.classes=db.classes.filter(c=>c.id!==id);db.sched=(db.sched||[]).filter(p=>p.cid!==id);if(db.cur===id)db.cur=db.classes[0]?db.classes[0].id:null;armed=null;save();render()}
function setCls(v){db.cur=v;db.exam=null;msg='';save();render()}
function setTab(t){db.tab=t;msg='';armed=null;edit=null;save();render()}

function bulk(){
  const c=cls(),have=new Set(c.students.map(s=>s.name));let n=0;
  $('#bulk').value.split(/\r?\n/).forEach(l=>{
    const p=l.split('\t');const ph=(p[1]||'').trim();l=p[0].replace(/^[\d\u0660-\u0669]+\s*[.\-)\u060C:]\s*/,'').trim();
    if(l&&!have.has(l)){have.add(l);c.students.push({id:uid(),name:l,phone:ph});n++}
  });
  msg=n?'تمت إضافة '+n+' طالب':'لا توجد أسماء جديدة';save();render();
}
function delSt(id){
  if(armed!==id){armed=id;render();return}
  const c=cls();c.students=c.students.filter(s=>s.id!==id);
  Object.values(c.att).forEach(d=>delete d[id]);c.exams.forEach(e=>delete e.scores[id]);c.evals=(c.evals||[]).filter(x=>x.sid!==id);Object.values(c.ev2||{}).forEach(d=>delete d[id]);if(c.gr)Object.values(c.gr).forEach(t=>delete t[id]);
  armed=null;save();render();
}
function delAll(){
  if(armed!=='ALL'){armed='ALL';render();return}
  const c=cls();c.students=[];c.att={};c.exams.forEach(e=>e.scores={});c.evals=[];c.ev2={};c.gr={};
  armed=null;msg='تم حذف كل الطلاب';save();render();
}
function mark(id,v){const c=cls(),d=c.att[db.date]=c.att[db.date]||{};if(d[id]===v)delete d[id];else d[id]=v;save();render()}
function allP(){const c=cls(),d=c.att[db.date]={};c.students.forEach(s=>d[s.id]='p');save();render()}
function setDate(v){db.date=v||today();save();render()}
function addExam(){
  const n=$('#en').value.trim(),m=parseFloat($('#em').value)||100;if(!n)return;
  const e={id:uid(),name:n,max:m,term:$('#et').value,subject:$('#exs')?$('#exs').value:'',scores:{},date:today()};cls().exams.push(e);db.exam=e.id;showEx=false;save();render();
}
function setExam(v){db.exam=v;save();render()}
function avg(e,c){const v=c.students.map(s=>e.scores[s.id]).filter(x=>typeof x==='number');return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'}

function viewAtt(c){
  const d=c.att[db.date]||{},L={p:'حاضر',a:'غائب',l:'متأخر',e:'مجاز'},cnt={p:0,a:0,l:0,e:0};
  c.students.forEach(s=>{if(d[s.id])cnt[d[s.id]]++});
  let h=`<div class="row" style="margin-bottom:8px"><input type="date" value="${db.date}" onchange="setDate(this.value)"><button onclick="allP()">الكل حاضر</button></div>
  <div class="sum">${Object.keys(L).map(k=>`<span>${L[k]}<i style="color:var(--${k})">${cnt[k]}</i></span>`).join('')}</div>`;
  if(!c.students.length)return h+'<div class="empty">أضف الطلاب أولاً من تبويب «الطلاب».</div>';
  return h+c.students.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="g4">${Object.keys(L).map(k=>`<button class="${k} ${d[s.id]===k?'on':''}" onclick="mark('${s.id}','${k}')">${L[k]}</button>`).join('')}</div></div>`).join('');
}
const gE=c=>(db.gt&&db.gt!=='all')?c.exams.filter(e=>e.term===db.gt):c.exams;
function stAvgG(c,sid){const pc=gE(c).map(e=>typeof e.scores[sid]==='number'?e.scores[sid]/e.max*100:null).filter(x=>x!==null);return pc.length?Math.round(pc.reduce((a,b)=>a+b,0)/pc.length)+'%':'-'}
let exEd={};
function saveScore(eid,sid){const c=cls(),e=c.exams.find(x=>x.id===eid);if(!e)return;const inp=document.getElementById('sc_'+eid+'_'+sid);if(!inp)return;const v=inp.value.trim();if(v===''){delete e.scores[sid];delete exEd[eid+'|'+sid];save();render();return}const n=parseFloat(v);if(isNaN(n)||n<0||n>e.max){inp.style.borderColor='var(--a)';inp.focus();return}e.scores[sid]=n;delete exEd[eid+'|'+sid];save();render()}
function editScore(eid,sid){exEd[eid+'|'+sid]=1;render();const i=document.getElementById('sc_'+eid+'_'+sid);if(i)i.focus()}
function delExam(id){if(armed!==id){armed=id;render();return}const c=cls();c.exams=c.exams.filter(e=>e.id!==id);if(db.exam===id)db.exam=null;armed=null;save();render()}
function viewGrades(c){
  const full=cls(),E=gE(c);
  let h=`<div class="card"><div class="st"><b>الامتحانات (${full.exams.length})</b><button class="${showEx?'':'p'}" onclick="showEx=!showEx;armed=null;render()">${showEx?'إغلاق':'+ امتحان'}</button></div>`;
  if(showEx){
    h+=`<select id="et" style="width:100%;margin-top:8px">${TERMS.map(t=>`<option ${t===db.gt?'selected':''}>${t}</option>`).join('')}</select>${(db.subjects||[]).length?`<select id="exs" style="width:100%;margin-top:6px">${db.subjects.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`:''}<div class="row" style="margin-top:8px"><input id="en" placeholder="اسم الامتحان: شهري، يومي..."><input id="em" type="number" inputmode="decimal" placeholder="الدرجة" style="width:90px"></div><button class="p" style="margin-top:8px" onclick="addExam()">إضافة الامتحان</button>`;
    h+=full.exams.map(e=>`<div class="st" style="padding:6px 0;border-top:1px solid var(--bd);margin-top:6px"><span><b>${esc(e.name)}</b><br><span class="mu">${e.subject?esc(e.subject)+' · ':''}${e.term?e.term+' · ':''}من ${e.max} · المعدل ${avg(e,full)}${e.date?' · '+e.date:''}</span></span><button class="x ${armed===e.id?'arm':''}" onclick="delExam('${e.id}')">${armed===e.id?'تأكيد الحذف':'✕'}</button></div>`).join('');
  }
  if(db.gt&&db.gt!=='all'){const tn=db.gt;h+=`<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><b>تحديد الدرجة (${esc(tn)})</b><p class="mu" style="margin:4px 0 8px">اكتب الدرجة التي تُحتسب منها امتحانات هذا الفصل (مثلاً 50). يُجمع كل امتحانات الطالب ويُقسَّم على مجموع درجات الامتحانات ثم يُضرب فيها، ويظهر في «مجموع ${esc(tn)}». اتركها فارغة لعرض المجموع كما هو.</p><div class="row">${(exTgt(tn)&&!tgEd[tn])?`<span style="flex:1"><b style="font-size:18px">${fmt(exTgt(tn))}</b> <button onclick="editExMax('${esc(tn)}')">تعديل</button></span>`:`<input type="text" id="tgin" inputmode="decimal" placeholder="من كم؟ مثل 50" value="${exTgt(tn)||''}" onkeydown="if(event.key==='Enter')saveExMax('${esc(tn)}')"><button class="p" onclick="saveExMax('${esc(tn)}')">حفظ</button>`}<span class="mu" style="white-space:nowrap">مجموع الامتحانات: ${fmt(c.exams.filter(e=>e.term===tn).reduce((a,e)=>a+(+e.max||0),0))}</span></div></div>`}
  h+='</div>';
  if(!full.exams.length)return h+'<div class="empty">أضف امتحاناً من زر «+ امتحان»، وبعدها يظهر تلقائياً عند كل طالب باسمه وخانة الدرجة.</div>';
  if(!E.length)return h+'<div class="empty">لا توجد امتحانات من هذا النوع.</div>';
  if(!c.students.length)return h+'<div class="empty">أضف الطلاب أولاً.</div>';
  return h+c.students.map(s=>`<div class="card"><div class="st"><b>${esc(s.name)}</b><span class="mu">المعدل: <b id="av_${s.id}">${stAvgG(full,s.id)}</b></span></div>${E.map(e=>`<div class="st" style="padding:6px 0;border-top:1px solid var(--bd)"><span>${esc((e.subject?e.subject+' - ':'')+e.name)}<span class="mu"> (من ${e.max})</span></span>${(typeof e.scores[s.id]==='number'&&!exEd[e.id+'|'+s.id])?`<span><b style="font-size:16px">${fmt(e.scores[s.id])}</b> <button onclick="editScore('${e.id}','${s.id}')">تعديل</button></span>`:`<span><input class="sc" id="sc_${e.id}_${s.id}" type="number" inputmode="decimal" max="${e.max}" value="${e.scores[s.id]??''}" onkeydown="if(event.key==='Enter')saveScore('${e.id}','${s.id}')"> <button class="p" onclick="saveScore('${e.id}','${s.id}')">حفظ</button></span>`}</div>`).join('')}</div>`).join('');
}
function saveSt(id){const s=cls().students.find(x=>x.id===id);const n=$('#en2').value.trim();if(n)s.name=n;s.phone=$('#ph').value.trim();edit=null;save();render()}
function viewStudents(c){
  const abs=id=>Object.values(c.att).filter(d=>d[id]==='a').length;
  const row=(s,i)=>edit===s.id
    ?`<div style="padding:8px 0;border-top:1px solid var(--bd)"><input id="en2" value="${esc(s.name)}"><input id="ph" type="tel" inputmode="tel" placeholder="رقم ولي الأمر" value="${esc(s.phone||'')}" style="margin-top:6px"><div class="row" style="margin-top:6px"><button class="p" onclick="saveSt('${s.id}')">حفظ</button><button onclick="edit=null;render()">إلغاء</button></div></div>`
    :`<div class="st" style="padding:7px 0;border-top:1px solid var(--bd)"><span><b>${(c.all||c.students).indexOf(s)+1}. ${esc(s.name)}</b>${abs(s.id)?`<span class="mu"> — غياب ${abs(s.id)}</span>`:''}${s.phone?`<br><a class="tel" href="tel:${esc(s.phone)}">📞 ${esc(s.phone)}</a>`:''}</span><span><button class="x" onclick="edit='${s.id}';armed=null;render()">تعديل</button><button class="x ${armed===s.id?'arm':''}" onclick="delSt('${s.id}')">${armed===s.id?'تأكيد الحذف':'✕'}</button></span></div>`;
  return `<div class="card"><b>إضافة طلاب دفعة واحدة</b>
  <p class="mu">الصق الأسماء، اسم واحد في كل سطر (من Excel أو واتساب أو Word). إذا كان بجانب الاسم رقم هاتف في عمود ثانٍ يُحفظ كرقم ولي الأمر.</p>
  <textarea id="bulk" rows="6" placeholder="أحمد علي&#10;زينب حسن&#10;محمد كريم"></textarea>
  <button class="p" onclick="bulk()">إضافة الكل</button>${msg?`<p class="ok">${msg}</p>`:''}</div>
  <div class="card"><div class="st"><b>طلاب الصف (${c.students.length})</b>${c.students.length?`<span><button class="x ${armed==='ALL'?'arm':''}" onclick="delAll()">${armed==='ALL'?'تأكيد حذف الكل':'حذف الكل'}</button>${armed==='ALL'?'<button class="x" onclick="armed=null;render()">إلغاء</button>':''}</span>`:''}</div>${c.students.length?c.students.map(row).join(''):'<p class="mu">لم تضف أي طالب بعد.</p>'}</div>`;
}

function setStars(i){evNote=$('#evn').value;evStars=i;render()}
function addEval(){const c=cls(),note=$('#evn').value.trim();if(!evStars&&!note)return;(c.evals=c.evals||[]).push({id:uid(),sid:evSid,date:today(),stars:evStars,note});evStars=0;evNote='';save();render()}
function delEval(id){const c=cls();c.evals=c.evals.filter(x=>x.id!==id);save();render()}
function viewNotes(c){
  if(!c.students.length)return '<div class="empty">أضف الطلاب أولاً.</div>';
  if(!c.students.some(s=>s.id===evSid))evSid=c.students[0].id;
  const hist=(c.evals||[]).filter(x=>x.sid===evSid).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><select onchange="evSid=this.value;evStars=0;evNote='';render()" style="width:100%">${c.students.map(s=>`<option value="${s.id}" ${s.id===evSid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <div class="stars" style="margin:8px 0">${[1,2,3,4,5].map(i=>`<button class="${i<=evStars?'on':''}" onclick="setStars(${i})">★</button>`).join('')}</div>
  <textarea id="evn" rows="3" placeholder="ملاحظة (مشاركة، سلوك، واجب...)">${esc(evNote)}</textarea>
  <button class="p" onclick="addEval()">حفظ التقييم</button></div>
  <div class="card"><b>سجل التقييم</b>${hist.length?hist.map(x=>`<div class="st" style="padding:6px 0;border-top:1px solid var(--bd)"><span style="color:var(--l)">${'★'.repeat(x.stars)}<span class="mu"> ${x.date}</span><br><span style="color:var(--tx)">${esc(x.note)}</span></span><button class="x" onclick="delEval('${x.id}')">✕</button></div>`).join(''):'<p class="mu">لا يوجد تقييم بعد.</p>'}</div>`;
}

async function dl(name,data){
  const ext=name.split('.').pop().toLowerCase(),mime={csv:'text/csv',json:'application/json',pdf:'application/pdf'}[ext]||'application/octet-stream';
  let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:name,data});msg='تم الحفظ'}catch(e){msg=e&&e.code==='declined'?'':'تعذر الحفظ'}render();return}
  if(window.claude){msg='التنزيل غير متاح في هذا العرض';render();return}
  const blob=new Blob([data],{type:mime});
  const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
  if(mobile&&navigator.canShare&&navigator.share){
    try{const f=new File([blob],name,{type:mime});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});msg='تمت المشاركة';render();return}}
    catch(e){if(e&&e.name==='AbortError'){render();return}}
  }

function makePdf(title,sub,date,head,rows,o={}){
  const W=1240,H=1754,M=70,TW=W-2*M,FS=o.fs||24,LH=Math.round(FS*1.5),PAD=o.pad||10,FONT='"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif';
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const setF=b=>{x.font=(b?'bold ':'')+FS+'px '+FONT;x.direction='rtl'};
  const S=v=>String(v==null?'':v);
  setF(false);
  const wt=head.map((h,j)=>{setF(true);let m=Math.min(x.measureText(S(h)).width,260);setF(false);rows.forEach(r=>{m=Math.max(m,Math.min(x.measureText(S(r[j])).width,520))});return Math.max(m+2*PAD,70)});

      const xl=xr-cw[j];

      x.strokeStyle='#777';x.lineWidth=1.5;x.strokeRect(xl,y,cw[j],r.h);
      x.save();x.beginPath();x.rect(xl,y,cw[j],r.h);x.clip();
      setF(bold);x.fillStyle='#000';x.textBaseline='middle';x.textAlign=j===0?'right':'center';
      ls.forEach((t,i)=>x.fillText(t,j===0?xr-PAD:xl+cw[j]/2,y+PAD+LH*(i+0.5)));
      x.restore();xr=xl;
    });
    y+=r.h;
  };
  const hdr=row(head,true);
  const start=first=>{
    x.fillStyle='#fff';x.fillRect(0,0,W,H);y=M;
    if(first){x.fillStyle='#000';x.textAlign='right';x.textBaseline='alphabetic';x.direction='rtl';x.font='bold 36px '+FONT;x.fillText(title,W-M,y+34);x.font='24px '+FONT;x.fillStyle='#555';x.fillText(sub,W-M,y+74);x.direction='ltr';x.textAlign='left';x.fillText(date,M,y+74);x.direction='rtl';y+=100}
    draw(hdr,true);
  };

  start(true);
  rows.forEach(r=>{const rr=row(r.map(S),false);if(y+rr.h>H-M){finish();start(false)}draw(rr,false)});
  finish();
  const enc=new TextEncoder(),chunks=[],offs=[];let off=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);off+=b.length};
  const N=pages.length,total=2+3*N;
  push('%PDF-1.4\n');
  offs[1]=off;push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  offs[2]=off;push('2 0 obj\n<</Type/Pages/Kids['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']/Count '+N+'>>\nendobj\n');
  pages.forEach((u,i)=>{
    const bin=atob(u.split(',')[1]),img=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)img[k]=bin.charCodeAt(k);
    const pg=3+3*i,ct=4+3*i,im=5+3*i,cs='q 595.32 0 0 841.92 0 0 cm /Im0 Do Q';
    offs[pg]=off;push(pg+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.32 841.92]/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>\nendobj\n');
    offs[ct]=off;push(ct+' 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[im]=off;push(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+W+'/Height '+H+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+img.length+'>>\nstream\n');push(img);push('\nendstream\nendobj\n');
  });
  const xo=off;push('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<</Size '+(total+1)+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;chunks.forEach(c=>{out.set(c,p);p+=c.length});

}

async function syncNow(initial){

  syncing=true;syncSt='جارٍ المزامنة…';
  try{
    const base=fbDb.collection('users').doc(fbU.uid);
    if(initial||cloudMt==null){
      const m=await base.collection('meta').doc('main').get();
      if(m.exists){
        const d=m.data();cloudMt=d.mt||0;cloudIds=d.classIds||[];
        if(cloudMt>(db.mt||0)){
          const hasLocal=db.classes.some(c=>c.students.length);
          if(!(hasLocal&&!db.sy&&!confirm('في حسابك بيانات محفوظة سابقاً وعلى هذا الجهاز بيانات أيضاً.\n\nموافق = استخدام بيانات الحساب (تُستبدل بيانات هذا الجهاز).\nإلغاء = رفع بيانات هذا الجهاز مكان بيانات الحساب.'))){
            await pull(base,d);syncing=false;render();return;
          }
        }
      }else{cloudMt=0;cloudIds=[]}
    }
    await push(base);
    syncSt='تمت المزامنة '+new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
  }catch(e){syncSt='تعذرت المزامنة: '+((e&&e.code)||'خطأ')+(e&&e.code==='permission-denied'?' (تحقق من قواعد Firestore)':'')}

  if(!initial&&(db.mt||0)>cloudMt&&!/تعذرت/.test(syncSt))pushSoon();
  if(db.view==='settings'&&!$('#ae'))render();
}
async function pull(base,meta){
  const snaps=await Promise.all((meta.classIds||[]).map(id=>base.collection('classes').doc(id).get()));
  const classes=snaps.filter(x=>x.exists).map(x=>JSON.parse(x.data().j));
  const keep={};LOCALK.forEach(k=>{if(k!=='classes'&&k!=='mt'&&k!=='sy')keep[k]=db[k]});
  db=Object.assign({classes:[],cur:null,tab:'stu',date:'',exam:null},JSON.parse(meta.j||'{}'),keep,{classes});
  if(!db.classes.some(c=>c.id===db.cur))db.cur=db.classes[0]?db.classes[0].id:null;
  db.date=today();db.edate=today();db.mt=meta.mt||0;db.sy=Date.now();
  persist();pushed={};classes.forEach(c=>pushed[c.id]=JSON.stringify(c));
  cloudMt=db.mt;cloudIds=classes.map(c=>c.id);
  syncSt='تم تحميل بياناتك من الحساب';
}
async function push(base){
  const mt=db.mt||Date.now(),ids=db.classes.map(c=>c.id),b=fbDb.batch(),np={};
  db.classes.forEach(c=>{const j=JSON.stringify(c);np[c.id]=j;if(pushed[c.id]!==j)b.set(base.collection('classes').doc(c.id),{j})});
  cloudIds.filter(i=>!ids.includes(i)).forEach(i=>b.delete(base.collection('classes').doc(i)));
  const rest={};Object.keys(db).forEach(k=>{if(!LOCALK.includes(k))rest[k]=db[k]});
  b.set(base.collection('meta').doc('main'),{mt,j:JSON.stringify(rest),classIds:ids});
  await b.commit();
  pushed=np;cloudIds=ids;cloudMt=mt;db.mt=Math.max(db.mt||0,mt);db.sy=Date.now();persist();
}

  const c=cls();if(!c)return '<div class="empty">أضف صفاً أولاً من «المزيد ← الصفوف».</div>';

  let h=classSel()+`<div class="card"><b>فترة ${TN[t]}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div style="min-width:0"><label class="mu" style="font-size:12px">من تاريخ</label><input type="date" style="width:100%;min-width:0" value="${r.f||''}" onchange="setTr('${t}','f',this.value)"></div><div style="min-width:0"><label class="mu" style="font-size:12px">إلى تاريخ</label><input type="date" style="width:100%;min-width:0" value="${r.t||''}" onchange="setTr('${t}','t',this.value)"></div></div><div class="row" style="margin-top:8px"><button onclick="clrTr('${t}')">كل الفترة</button></div><p class="mu" style="margin:8px 0 0">تُحسب الدرجة من التقييم والحضور المسجّلين داخل هذه الفترة فقط.</p></div>`;
  h+=`<div class="row" style="margin-bottom:10px"><input type="search" placeholder="🔍 بحث عن طالب/ة" oninput="gfilter(this.value)"></div>`;
  if(!c.students.length)return h+'<div class="empty">أضف الطلاب أولاً من «المزيد ← الطلاب».</div>';
  const H=dHead();
  h+=`<div class="gwrap"><table class="gt" id="gtab"><tr>${H.map((x,i)=>`<th${i===0?' class="gsn"':''}>${esc(x)}</th>`).join('')}</tr>`;
  h+=dCalc(c,t).map(({s,e,a,tot,adj},n)=>`<tr data-n="${esc(s.name)}"${a.a>=4?' class="red"':''}><td class="gsn">${n+1}. ${esc(s.name)}</td><td>${fmt(e.p.tahd)}</td><td>${fmt(e.p.dftr)}</td><td>${fmt(e.p.mush)}</td><td>${e.bd?'−'+fmt(e.bd):'0'}</td><td><b>${fmt(e.tot)}</b></td><td>${a.a}</td><td>${a.l}</td><td><b>${fmt(a.pts)}</b></td><td><input type="text" style="width:58px;border:1px solid var(--bd);border-radius:8px" placeholder="0" value="${adj?fmt(adj):''}" onchange="setAdj('${t}','${s.id}',this)"></td><td class="gtot">${fmt(tot)}</td></tr>`).join('');
  h+=`</table></div><p class="mu" style="margin:8px 2px">التقييم: متوسط نجوم التحضير والواجب والمشاركة × درجة كل واحد، ثم يُخصم السلوك (${fmt(w.bd)} لكل نجمة). الحضور: ${fmt(w.att)} ويُخصم ${fmt(w.abs)} للغياب و${fmt(w.late)} للتأخر والمجاز لا يُخصم. عمود «تعديل» لإضافة درجات (مثل 1) أو حذفها (مثل -1) من الدرجة اليومية، واتركه فارغاً لإلغاء التعديل. المجموع جاهز لتجمعه مع درجة الامتحان الشهري.</p><div class="row"><button class="p" style="flex:1" onclick="exportD('${t}')">تصدير إلى Excel</button><button class="p" style="flex:1" onclick="pdfD('${t}')">مشاركة / طباعة PDF</button></div>`;
  return h;
}
const TT={d1:['الفصل الأول','مجموع الفصل الأول'],d2:['الفصل الثاني','مجموع الفصل الثاني']};
const exTgt=tn=>+((db.exmx||{})[tn])||0;
let tgEd={};
function saveExMax(tn){const el=document.getElementById('tgin');if(!el)return;const n=parseFloat(String(el.value).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,،]/g,'.'));db.exmx=db.exmx||{};if(isNaN(n)||n<=0)delete db.exmx[tn];else db.exmx[tn]=n;delete tgEd[tn];save();render()}
function editExMax(tn){tgEd[tn]=1;render();const i=document.getElementById('tgin');if(i)i.focus()}
function tCalc(c,t){const ex=c.exams.filter(e=>e.term===TT[t][0]),mx=ex.reduce((a,e)=>a+(+e.max||0),0),tg=exTgt(TT[t][0]),tgt=tg&&mx?tg:mx;return {ex,mx,tgt,rows:dCalc(c,t).map(({s,e,a,tot})=>{const raw=ex.reduce((x,q)=>x+(typeof q.scores[s.id]==='number'?q.scores[s.id]:0),0),es=tg&&mx?up(raw/mx*tg):raw;return {s,a,es,d:tot,tot:up(es+tot)}})}}
function tHead(c,t){const T=tCalc(c,t);return ['الطالب',...T.ex.map(e=>(e.subject?e.subject+' - ':'')+e.name+' (من '+e.max+')'),'مجموع الامتحانات (من '+fmt(T.tgt)+')','اليومي (من '+fmt(sumW()+dsc().att)+')','المجموع (من '+fmt(T.tgt+sumW()+dsc().att)+')']}
function tRows(c,t){const T=tCalc(c,t);return T.rows.map(r=>[r.s.name,...T.ex.map(e=>typeof e.scores[r.s.id]==='number'?fmt(e.scores[r.s.id]):''),fmt(r.es),fmt(r.d),fmt(r.tot)])}
function exportT(t){const c=cls();csvOut(TT[t][1]+'-'+c.name,tHead(c,t),tRows(c,t))}
function pdfT(t){const c=cls();pdfOut(TT[t][1]+trTxt(t)+' - '+clsLabel(c),tHead(c,t),tRows(c,t))}
function viewGT(t){
  const c=cls();if(!c)return '<div class="empty">أضف صفاً أولاً من «المزيد ← الصفوف».</div>';
  const r=trg(t),T=tCalc(c,t);
  let h=classSel()+`<div class="card"><b>فترة ${TT[t][1]}</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div style="min-width:0"><label class="mu" style="font-size:12px">من تاريخ</label><input type="date" style="width:100%;min-width:0" value="${r.f||''}" onchange="setTr('${t}','f',this.value)"></div><div style="min-width:0"><label class="mu" style="font-size:12px">إلى تاريخ</label><input type="date" style="width:100%;min-width:0" value="${r.t||''}" onchange="setTr('${t}','t',this.value)"></div></div><div class="row" style="margin-top:8px"><button onclick="clrTr('${t}')">كل الفترة</button></div><p class="mu" style="margin:8px 0 0">الفترة تخص اليومي والغياب. الامتحانات تؤخذ كلها من امتحانات «${TT[t][0]}».</p></div>`;
  h+=`<div class="row" style="margin-bottom:10px"><input type="search" placeholder="🔍 بحث عن طالب/ة" oninput="gfilter(this.value)"></div>`;
  if(!c.students.length)return h+'<div class="empty">أضف الطلاب أولاً من «المزيد ← الطلاب».</div>';
  if(!T.ex.length)h+=`<div class="empty" style="margin-bottom:10px">لا توجد امتحانات مسجّلة للـ${TT[t][0]}، والمجموع هنا هو اليومي فقط. أضف امتحاناً واختر الفصل.</div>`;
  const H=tHead(c,t);
  h+=`<div class="gwrap"><table class="gt" id="gtab"><tr>${H.map((x,i)=>`<th${i===0?' class="gsn"':''}>${esc(x)}</th>`).join('')}</tr>`;
  h+=T.rows.map((q,n)=>`<tr data-n="${esc(q.s.name)}"><td class="gsn">${n+1}. ${esc(q.s.name)}</td>${T.ex.map(e=>`<td>${typeof e.scores[q.s.id]==='number'?fmt(e.scores[q.s.id]):'-'}</td>`).join('')}<td><b>${fmt(q.es)}</b></td><td><b>${fmt(q.d)}</b></td><td class="gtot">${fmt(q.tot)}</td></tr>`).join('');
  h+=`</table></div><p class="mu" style="margin:8px 2px">المجموع = درجات امتحانات ${TT[t][0]} + الدرجة اليومية. الامتحان الذي لم تُسجَّل له درجة يُحسب صفراً.</p><div class="row"><button class="p" style="flex:1" onclick="exportT('${t}')">تصدير إلى Excel</button><button class="p" style="flex:1" onclick="pdfT('${t}')">مشاركة / طباعة PDF</button></div>`;
  return h;
}
function mget(c,sid,k){const v=((gr(c).m||{})[sid]||{})[k];return v===undefined?'':v}
function setM(sid,k,el){
  const c=cls();if(!c)return;const m=gr(c).m=gr(c).m||{},d=m[sid]=m[sid]||{};let v=el.value.trim();
  if(v===''||isNaN(+v))delete d[k];else{v=Math.max(0,Math.min(+v,gmax()));d[k]=v;el.value=fmt(v)}
  if(!Object.keys(d).length)delete m[sid];save();
}
function mRows(c){return c.students.map(s=>[s.name,...MCOLS.map(([k])=>{const v=mget(c,s.id,k);return v===''?'':fmt(v)})])}
function mHead(){return ['الطالب',...MCOLS.map(x=>x[1]+' (من '+gmax()+')')]}
function exportM(){const c=cls();csvOut('الدرجات-الشهرية-'+c.name,mHead(),mRows(c))}
function pdfM(){const c=cls();pdfOut('الدرجات الشهرية - '+clsLabel(c),mHead(),mRows(c))}
function viewGM(){
  const c=cls();if(!c)return '<div class="empty">أضف صفاً أولاً من «المزيد ← الصفوف».</div>';
  let h=classSel()+`<div class="row" style="margin-bottom:10px"><input type="search" placeholder="🔍 بحث عن طالب/ة" oninput="gfilter(this.value)"></div>`;
  if(!c.students.length)return h+'<div class="empty">أضف الطلاب أولاً من «المزيد ← الطلاب».</div>';
  h+=`<div class="gwrap"><table class="gt" id="gtab"><tr><th class="gsn">الطالب</th>${MCOLS.map(x=>`<th>${x[1]}<br>(من ${gmax()})</th>`).join('')}</tr>`;
  h+=c.students.map((s,n)=>`<tr data-n="${esc(s.name)}"><td class="gsn">${n+1}. ${esc(s.name)}</td>${MCOLS.map(([k])=>`<td><input type="number" inputmode="decimal" step="0.25" min="0" max="${gmax()}" value="${mget(c,s.id,k)}" onchange="setM('${s.id}','${k}',this)"></td>`).join('')}</tr>`).join('');
  h+=`</table></div><p class="mu" style="margin:8px 2px">الدرجة العظمى لكل خانة ${gmax()}. غيّرها من «توزيع درجات اليومي».</p><div class="row"><button class="p" style="flex:1" onclick="exportM()">تصدير إلى Excel</button><button class="p" style="flex:1" onclick="pdfM()">مشاركة / طباعة PDF</button></div>`;
  return h;
}
function setGmax(v){db.gmax=+v;save();render()}
function setGrp(id,f,el){
  const g=dgs().find(x=>x.id===id);if(!g)return;
  if(f==='name')g.name=el.value.trim()||g.name;
  else if(f==='cells'){const n=Math.round(+el.value);g.cells=Math.max(1,Math.min(20,n||g.cells))}
  else{const n=+el.value;g.total=n>=0?n:g.total}
  save();render();
}
function addGrp(){dgs().push({id:uid(),name:'مجموعة جديدة',cells:5,total:2.5});save();render()}
function delGrp(id){if(armed!==id){armed=id;render();return}db.dgroups=dgs().filter(g=>g.id!==id);armed=null;save();render()}
function viewGSet(){
  const G=dgs(),sum=G.reduce((a,g)=>a+g.total,0);
  return `<div class="card"><b>درجات الصف</b><p class="mu">للابتدائي من الأول إلى الرابع تكون درجات اليومي والشهري ونصف السنة والسعي السنوي والنهائي من 10، وباقي الصفوف من 100.</p><select onchange="setGmax(this.value)" style="width:100%"><option value="10" ${gmax()===10?'selected':''}>من 10</option><option value="100" ${gmax()===100?'selected':''}>من 100</option></select></div>`
  +`<div class="card"><b>توزيع درجات اليومي</b><p class="mu">غيّر أسماء مجموعات اليومي وعدد خاناتها ودرجاتها.</p>${G.map(g=>`<div class="grow"><div><label>اسم المجموعة</label><input value="${esc(g.name)}" onchange="setGrp('${g.id}','name',this)"></div><div><label>عدد الخانات</label><input type="number" inputmode="numeric" min="1" max="20" value="${g.cells}" onchange="setGrp('${g.id}','cells',this)"></div><div><label>الدرجة الكلية</label><input type="number" inputmode="decimal" step="0.25" min="0" value="${fmt(g.total)}" onchange="setGrp('${g.id}','total',this)"></div><button class="x ${armed===g.id?'arm':''}" onclick="delGrp('${g.id}')">${armed===g.id?'تأكيد':'حذف'}</button></div>`).join('')}<div class="row" style="margin-top:10px"><button class="p" style="flex:1" onclick="addGrp()">+ إضافة مجموعة</button></div><p class="mu" style="margin-top:8px">مجموع درجات اليومي: <b>${fmt(sum)}</b>${sum!==gmax()?` (الدرجة العظمى للصف ${gmax()})`:''}</p></div>`;
}

function viewSettings(){return accCard()+backupCard()+archiveCard()+pinCard()}
function render(){
  if(locked){$('#app').innerHTML=lockView();return}
  const v=curView(),par=PARENT[v]||'more';
  const VV={home:viewHome,exams:viewExams,more:viewMore,att:viewAttPage,exterm:()=>backBtn()+classPage('grd',false),
    schools:()=>backBtn()+listCard('schools','المدارس','اسم المدرسة'),subjects:()=>backBtn()+listCard('subjects','المواد','اسم المادة'),
    classes:()=>backBtn()+viewClasses(),students:()=>backBtn()+classPage('stu',true),sched:()=>backBtn()+viewSched(),eval:()=>backBtn()+classPage('evl',true),
    settings:()=>backBtn()+viewSettings(),gd1:()=>backBtn()+viewGD('d1'),gd2:()=>backBtn()+viewGD('d2'),gt1:()=>backBtn()+viewGT('d1'),gt2:()=>backBtn()+viewGT('d2'),gset:()=>backBtn()+viewGSet(),rexam:viewRExam,ratt:viewRAtt,reval:viewREval,rfin:viewRFin,rreg:viewRReg};
  const nav=[['home','الرئيسية','🏠'],['exams','الامتحانات','📝'],['more','المزيد','☰']];
  const body=(VV[v]||viewHome)();
  $('#app').innerHTML=`<div class="top"><b>${TITLES[v]||''}</b><span class="lg"><img src="icon-192.png" alt="" width="26" height="26">دفتر المعلم</span></div>`+((v==='home'||v==='more')?accBanner()+bkBanner():'')+body
    +`<nav class="bnav">${nav.map(t=>`<button class="${par===t[0]?'on':''}" onclick="setView('${t[0]}')"><i>${t[2]}</i>${t[1]}</button>`).join('')}</nav>`;
}
fbStart();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)showUpd()})}
load();locked=!!db.pin;if(!db.date)db.date=today();if(!db.edate)db.edate=today();if(!cls()&&db.classes.length)db.cur=db.classes[0].id;render();
</script>
